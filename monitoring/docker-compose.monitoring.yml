version: "3.9"

# ─────────────────────────────────────────────────────────────
#  monitoring/docker-compose.monitoring.yml
#
#  Runs Prometheus + Grafana as a monitoring stack.
#
#  Usage (from repo root):
#    docker-compose -f monitoring/docker-compose.monitoring.yml up -d
#
#  Access:
#    Prometheus:  http://localhost:9090
#    Grafana:     http://localhost:3001   (admin / admin)
# ─────────────────────────────────────────────────────────────

services:

  # ── Prometheus: collects & stores metrics ─────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: mcq-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Mount our config file into the container
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Persist metric data between restarts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'   # Keep 15 days of data
    networks:
      - monitoring

  # ── Grafana: dashboards & visualizations ──────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: mcq-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin   # Change this!
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
