server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── API proxy ───────────────────────────────
    # Requests to /api/... are forwarded to the backend container
    # "backend" = the service name in docker-compose.yml
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── React Router fix ────────────────────────
    # Without this, refreshing on /quiz/os gives a 404.
    # We always serve index.html and let React Router decide the page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
