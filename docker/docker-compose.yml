version: "3.9"

# ─────────────────────────────────────────────────────────────
# docker-compose.yml  —  Run the full MCQ-prep stack locally
#
# Services:
#   mongo    → MongoDB database
#   backend  → Node.js / Express API (port 5000)
#   frontend → React app served by nginx (port 3000)
#
# Usage:
#   docker-compose up --build        # First time
#   docker-compose up -d             # Background
#   docker-compose down              # Stop & remove containers
#   docker-compose logs -f backend   # Watch backend logs
# ─────────────────────────────────────────────────────────────

services:

  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:6           # Official MongoDB 6 image
    container_name: mcq-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db  # Persist data between restarts
    networks:
      - mcq-network

  # ── Backend (Node.js + Express) ───────────────────────────
  backend:
    build:
      context: ..                          # Root of your repo
      dockerfile: docker/Dockerfile.backend
    container_name: mcq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      # "mongo" = the service name above — Docker resolves it automatically
      MONGO_URI: mongodb://mongo:27017/mcqapp
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      NODE_ENV: production
    depends_on:
      - mongo                # Wait for mongo to start first
    networks:
      - mcq-network

  # ── Frontend (React + nginx) ──────────────────────────────
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: mcq-frontend
    restart: unless-stopped
    ports:
      - "3000:80"            # Visit http://localhost:3000
    depends_on:
      - backend
    networks:
      - mcq-network

# ── Named volume (keeps MongoDB data safe across restarts) ───
volumes:
  mongo_data:

# ── Shared network (containers talk to each other by name) ───
networks:
  mcq-network:
    driver: bridge
