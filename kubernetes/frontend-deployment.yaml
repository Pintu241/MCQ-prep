# ═══════════════════════════════════════════════════════════════
#  kubernetes/frontend-deployment.yaml
# ═══════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcq-frontend
  labels:
    app: mcq-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcq-frontend
  template:
    metadata:
      labels:
        app: mcq-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB_USERNAME/mcq-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: mcq-frontend-service
spec:
  selector:
    app: mcq-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
# ── Ingress: The public entry point (like a reverse proxy) ─────
# Requires nginx-ingress-controller installed in your cluster
# Install: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcq-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # React frontend — catch all routes
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcq-frontend-service
                port:
                  number: 80
          # API routes go to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mcq-backend-service
                port:
                  number: 5000
